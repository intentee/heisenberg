[workspace]
members = ["bindings", "bindings_sys"]
resolver = "3"

[workspace.metadata.heisenberg]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[workspace.metadata.heisenberg.out_dirs.bindings_sys]
directory = "bindings_sys/generated"

[workspace.metadata.heisenberg.out_dirs.bindings_sys.targets.x86_64-pc-windows-msvc]
cfgs = ["declared_backend"]
env = { DECLARED_VALUE = "declared" }

[workspace.metadata.heisenberg.out_dirs.bindings_sys.targets.x86_64-unknown-linux-gnu]
cfgs = ["declared_backend"]
env = { DECLARED_VALUE = "declared" }

[workspace.metadata.heisenberg.out_dirs.bindings_sys.targets.aarch64-apple-darwin]
cfgs = []
env = {}
