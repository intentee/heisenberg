[package]
name = "file_local_test_helpers"
edition = "2024"
version = "0.1.0"
autotests = false

[workspace]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc"
target = "x86_64-pc-windows-msvc"
default_features = true
features = []

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[[test]]
name = "helper_used_by_a_submodule"
path = "tests/helper_used_by_a_submodule.rs"

[[test]]
name = "local_helpers"
path = "tests/local_helpers.rs"

[[test]]
name = "unused_helper"
path = "tests/unused_helper.rs"

[lib]
doctest = false
