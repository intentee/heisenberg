[profile.default]
test-threads = 2

[profile.inherited]
slow-timeout = ""

[profile.late]
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.lenient]
slow-timeout = { period = "5s", terminate-after = 2, on-timeout = "pass" }

[profile.periodic]
slow-timeout = { period = "5s" }

[profile.slow]
slow-timeout = { period = "15s", terminate-after = 1 }

[profile.unbounded]
slow-timeout = "5s"
