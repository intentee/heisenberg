[workspace]
members = [
    "app",
    "app_checks",
    "builder",
    "helper",
    "idle",
    "provider",
    "spare",
    "tested_with",
    "unbuilt",
]
exclude = ["outside_checker"]
resolver = "3"

[workspace.metadata.heisenberg]
test_crates = ["app_checks"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc"
target = "x86_64-pc-windows-msvc"
default_features = true
features = []

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []
