[package]
name = "app"
edition = "2024"
version = "0.1.0"
build = "build.rs"
autoexamples = false

[dependencies]
provider = { path = "../provider" }
spare = { path = "../spare" }
tested_with = { path = "../tested_with" }

[dev-dependencies]
helper = { path = "../helper" }
idle = { path = "../idle" }
outside_checker = { path = "../outside_checker" }

[build-dependencies]
builder = { path = "../builder" }
unbuilt = { path = "../unbuilt" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[lib]
doctest = false

[[example]]
name = "show"
path = "examples/show.rs"
