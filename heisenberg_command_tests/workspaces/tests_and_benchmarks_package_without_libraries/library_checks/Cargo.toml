[package]
name = "library_checks"
edition = "2024"
version = "0.1.0"
autotests = false

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
library = { path = "../library" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[[bench]]
name = "construction"
harness = false

[[test]]
name = "library_is_constructible"
path = "tests/library_is_constructible.rs"
