[package]
name = "app"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
functions_used_only_by_tests_in_a_publishable_library = { path = ".." }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
