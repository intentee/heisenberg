[package]
name = "negative_literal_through_a_declarative_macro"
edition = "2024"
version = "0.1.0"

[dependencies]
literal_emitter = { path = "literal_emitter" }

[workspace]
exclude = ["literal_emitter"]

[lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
