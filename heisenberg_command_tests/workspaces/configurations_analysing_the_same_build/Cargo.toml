[package]
name = "configurations_analysing_the_same_build"
edition = "2024"
version = "0.1.0"

[features]
cyclic = []
verbose = []

[workspace]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]

[[workspace.metadata.heisenberg.configurations]]
name = "plain"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["cyclic"]

[[workspace.metadata.heisenberg.configurations]]
name = "repeated"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["cyclic"]

[lib]
doctest = false
