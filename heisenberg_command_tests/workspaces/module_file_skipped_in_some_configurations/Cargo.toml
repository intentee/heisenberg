[package]
name = "module_file_skipped_in_some_configurations"
edition = "2024"
version = "0.1.0"

[workspace]

[features]
early = []
late = []

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu-early"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["early"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu-late"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["late"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc-early"
target = "x86_64-pc-windows-msvc"
default_features = true
features = ["early"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc-late"
target = "x86_64-pc-windows-msvc"
default_features = true
features = ["late"]
