[package]
name = "clippy_lint_under_a_former_name"
edition = "2024"
version = "0.1.0"

[workspace]

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
expect_used = "deny"
indexing_slicing = "deny"
integer_arithmetic = "deny"
option_unwrap_used = "allow"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

[workspace.metadata.heisenberg]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc"
target = "x86_64-pc-windows-msvc"
default_features = true
features = []

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[lib]
doctest = false
