[workspace]
members = ["bindings", "bindings_sys"]
resolver = "3"

[workspace.metadata.heisenberg]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc"
target = "x86_64-pc-windows-msvc"
default_features = true
features = []

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-pc-windows-msvc-accelerated"
target = "x86_64-pc-windows-msvc"
default_features = true
features = ["accelerated"]

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = []

[[workspace.metadata.heisenberg.configurations]]
name = "x86_64-unknown-linux-gnu-accelerated"
target = "x86_64-unknown-linux-gnu"
default_features = true
features = ["accelerated"]

[workspace.metadata.heisenberg.out_dirs.bindings_sys]
version = "0.1.0"

[workspace.metadata.heisenberg.out_dirs.bindings_sys.configurations.x86_64-pc-windows-msvc]
directory = "bindings_sys/generated/x86_64-pc-windows-msvc"
cfgs = ["declared_backend"]
env = { DECLARED_VALUE = "declared" }

[workspace.metadata.heisenberg.out_dirs.bindings_sys.configurations.x86_64-pc-windows-msvc-accelerated]
directory = "bindings_sys/generated/x86_64-pc-windows-msvc-accelerated"
cfgs = ["accelerated_backend", "declared_backend"]
env = { DECLARED_VALUE = "accelerated" }

[workspace.metadata.heisenberg.out_dirs.bindings_sys.configurations.x86_64-unknown-linux-gnu]
directory = "bindings_sys/generated/x86_64-unknown-linux-gnu"
cfgs = ["declared_backend"]
env = { DECLARED_VALUE = "declared" }

[workspace.metadata.heisenberg.out_dirs.bindings_sys.configurations.x86_64-unknown-linux-gnu-accelerated]
directory = "bindings_sys/generated/x86_64-unknown-linux-gnu-accelerated"
cfgs = ["accelerated_backend", "declared_backend"]
env = { DECLARED_VALUE = "accelerated" }
