[package]
name = "tested"
edition = "2024"
version = "0.1.0"
publish = false

[dependencies]
x = { path = "../vendor/x", optional = true }

[build-dependencies]
q = { path = "../vendor/q" }

[dev-dependencies]
q = { path = "../vendor/q", features = ["extra"] }
x = { path = "../vendor/x" }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
arithmetic_side_effects = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
panic_in_result_fn = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
