[package]
name = "clippy_lint_warned_under_warned_warnings"
edition = "2024"
version = "0.1.0"

[workspace]

[lints.clippy]
expect_used = "warn"
panic = "deny"
unwrap_used = "deny"

[lints.rust]
warnings = "warn"

[workspace.metadata.heisenberg]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
